name: Feature request
description: 提出一个功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便，或哪个场景没有覆盖
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它怎么工作
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你试过或考虑过的其他做法
  - type: input
    id: platform
    attributes:
      label: 相关平台
      placeholder: "Windows / macOS / 两者"